<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领登记</title>
</head>
<body>
  <header>
    <h1>校园失物招领登记</h1>
    <p>丢了东西或捡到东西，都在这里登记</p>
  </header>
  <nav>
    <a href="#intro">登记说明</a>
    <a href="#form">开始登记</a>
  </nav>
  <main>
    <section id="intro">
      <h2>登记说明</h2>
      <p>本页面用于校园内失物与招领信息登记：捡到物品的同学可发布招领，丢失物品的同学可留下线索。所填信息仅用于物品归还时联系，不对外公开展示。</p>
    </section>
    <section id="form">
      <h2>登记表单</h2>
      <form action="#" method="get">
        <p>登记类型</p>
        <p>
          <label><input type="radio" name="kind" value="lost" checked> 我丢了物品</label>
          <label><input type="radio" name="kind" value="found"> 我捡到物品</label>
        </p>
        <p>
          <label for="item">物品分类</label>
          <select id="item" name="item" required>
            <option value="">请选择</option>
            <option value="card">证件卡类</option>
            <option value="electronics">电子设备</option>
            <option value="keys">钥匙</option>
            <option value="books">书籍资料</option>
            <option value="clothes">衣物</option>
            <option value="other">其他</option>
          </select>
        </p>
        <p>
          <label for="date">丢失/拾获日期</label>
          <input type="date" id="date" name="date" max="2026-09-05" required>
        </p>
        <p>
          <label for="place">地点</label>
          <input type="text" id="place" name="place" placeholder="如：图书馆三楼自习区" maxlength="30" required>
        </p>
        <p>
          <label for="name">联系人姓名</label>
          <input type="text" id="name" name="name" placeholder="怎么称呼你" pattern="\S{1,10}" title="1到10个字符，且不能包含空格" required>
        </p>
        <p>
          <label for="phone">联系电话</label>
          <input type="text" id="phone" name="phone" inputmode="numeric" placeholder="11位手机号" pattern="\d{11}" title="请输入11位数字手机号" required>
        </p>
        <p>
          <label for="mail">邮箱（选填）</label>
          <input type="email" id="mail" name="mail" placeholder="example@domain.com">
        </p>
        <p>
          <label for="photo">物品照片</label>
          <input type="file" id="photo" name="photo" accept="image/*">
        </p>
        <p>
          <label for="desc">物品特征描述</label><br>
          <textarea id="desc" name="desc" rows="4" maxlength="200" placeholder="颜色、品牌、外观特征等"></textarea>
        </p>
        <p>
          <label><input type="checkbox" name="agree" required> 我保证所填信息真实有效</label>
        </p>
        <p>
          <button type="submit">提交登记</button>
        </p>
      </form>
    </section>
  </main>
  <footer>
    <p>软件开发综合实践 · 课程演示案例</p>
  </footer>
</body>
</html>
